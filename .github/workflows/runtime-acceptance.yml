name: NUSA Runtime Acceptance
on:
  workflow_run:
    workflows: ["Deploy NUSA to GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify GitHub Pages runtime
        env:
          BASE_URL: https://yudi8377.github.io/NUSA_ENTERPRISE_ENGINEERING_OS/
        run: |
          set -euo pipefail
          echo "Checking $BASE_URL"
          curl --fail --silent --show-error --location --retry 8 --retry-delay 5 --retry-all-errors --max-time 30 "$BASE_URL" -o /tmp/nusa.html
          test -s /tmp/nusa.html
          grep -qi "NUSA" /tmp/nusa.html
          grep -q "/NUSA_ENTERPRISE_ENGINEERING_OS/" /tmp/nusa.html
          echo "NUSA runtime HTML: PASS"
      - name: Verify primary application routes
        env:
          BASE_URL: https://yudi8377.github.io/NUSA_ENTERPRISE_ENGINEERING_OS
        run: |
          set -euo pipefail
          check_route() {
            route="$1"
            marker="$2"
            file="/tmp/nusa-route-$(echo "$route" | tr '/' '-' | tr -d '-')"
            echo "Checking $route"
            curl --fail --silent --show-error --location --retry 5 --retry-delay 3 --retry-all-errors --max-time 30 "$BASE_URL$route" -o "$file"
            test -s "$file"
            grep -qi "$marker" "$file"
          }
          check_route "/operations/" "Operations Studio"
          check_route "/projects/" "Projects"
          check_route "/master-data/" "Master Data"
          check_route "/architecture/" "Architecture"
          check_route "/erp/" "ERP"
          check_route "/crm/" "CRM"
          check_route "/hr/" "Payroll"
          check_route "/procurement/" "Procurement"
          check_route "/reports/" "Reports"
          check_route "/grc/" "Compliance"
          echo "Primary route checks: PASS (10 routes)"
          # Context-specific enterprise and engineering submodules
          check_route "/crm/leads/" "Lead & Opportunity Pipeline"
          check_route "/crm/contacts/" "Account & Contact Registry"
          check_route "/crm/quotations/" "Quotation & Commercial Offer"
          check_route "/crm/activities/" "Customer Activities"
          check_route "/hr/recruitment/" "Workforce Planning & Recruitment"
          check_route "/hr/attendance/" "Attendance & Shift Review"
          check_route "/hr/training/" "Training & Competency"
          check_route "/hr/payroll/" "Payroll Control Center"
          check_route "/procurement/requests/" "Purchase Requisition"
          check_route "/procurement/vendors/" "Vendor Qualification"
          check_route "/procurement/orders/" "Purchase Order & Contract Draft"
          check_route "/procurement/inventory/" "Inventory & Materials"
          check_route "/reports/kpi/" "KPI Dictionary"
          check_route "/reports/forecast/" "Forecast & Scenario"
          check_route "/reports/packs/" "Report Packs & Distribution"
          check_route "/reports/scenarios/" "Decision Scenarios"
          check_route "/grc/risks/" "Enterprise Risk Register"
          check_route "/grc/audit/" "Audit Findings & CAPA"
          check_route "/grc/compliance/" "Compliance Obligations"
          check_route "/grc/incidents/" "Incident & Near Miss"
          check_route "/operations/structural-analysis/" "Structural Analysis & SAP2000"
          check_route "/operations/geotechnical/" "Geotechnical & Foundation Review"
          check_route "/operations/sap2000-model/" "SAP2000 Model Preparation"
          check_route "/operations/mep-coordination/" "MEP Engineering Coordination"
          check_route "/operations/quantity-surveying/" "Quantity Surveying & Cost Estimate"
          check_route "/operations/site-inspection/" "Site Inspection & Field Evidence"
          check_route "/architecture/cad-drawings/" "CAD Drawing Register"
          check_route "/architecture/bim-coordination/" "BIM / IFC Coordination"
          check_route "/architecture/clash-review/" "Clash Detection & Issue Review"
          check_route "/architecture/design-review/" "Design Review & Technical Query"
          check_route "/architecture/spatial-data/" "Spatial / GIS Engineering Register"
          echo "Contextual submodule route checks: PASS (31 routes)"
      - name: Verify static assets referenced by HTML
        env:
          BASE_URL: https://yudi8377.github.io/NUSA_ENTERPRISE_ENGINEERING_OS/
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, urllib.parse, urllib.request
          base="https://yudi8377.github.io/NUSA_ENTERPRISE_ENGINEERING_OS/"
          html=open("/tmp/nusa.html", encoding="utf-8").read()
          urls=[]
          for attr in ("src","href"):
              urls += re.findall(r'%s="([^"]+)"' % attr, html)
          urls=[u for u in urls if u.startswith(("/NUSA_ENTERPRISE_ENGINEERING_OS/","/_next/"))]
          checked=0
          for u in urls:
              full=urllib.parse.urljoin(base,u)
              try:
                  with urllib.request.urlopen(full, timeout=20) as r:
                      if r.status >= 400:
                          raise RuntimeError(f"{r.status} {full}")
              except Exception as e:
                  raise SystemExit(f"ASSET FAIL: {e}")
              checked += 1
          print(f"Static asset checks: PASS ({checked} assets)")
          PY
